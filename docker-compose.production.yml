# Fichier autonome ; ne pas fusionner avec le Compose SQLite local.
name: autohelp-production
services:
  caddy:
    image: caddy:2.11.9-alpine
    environment:
      DOMAIN: ${DOMAIN:?Renseignez le domaine du serveur}
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [front]
    restart: unless-stopped
    depends_on: [web]
  web:
    build: .
    image: autohelp:latest
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Définissez une clé aléatoire de 32 caractères minimum}
      DATABASE_URL: postgresql+psycopg://autohelp@db:5432/autohelp
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      PROXY_HOPS: "1"
      PORT: "5000"
      SECRET_DIR: /app/instance/secrets
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_CALL_TIMEOUT: ${LLM_CALL_TIMEOUT:-5}
      LLM_TOTAL_TIMEOUT: ${LLM_TOTAL_TIMEOUT:-20}
      LLM_MAX_TURNS: ${LLM_MAX_TURNS:-4}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}
      LLM_CONTEXT_CHARS: ${LLM_CONTEXT_CHARS:-28000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
    secrets: [db_password]
    volumes:
      - autohelp_instance:/app/instance
      - ./data/manuels:/app/data/manuels:ro
    networks: [front, private]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: autohelp
      POSTGRES_USER: autohelp
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U autohelp -d autohelp]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
  backup:
    build: {context: ., dockerfile: docker/Dockerfile.backup}
    image: autohelp-backup:local
    environment:
      PGHOST: db
      PGDATABASE: autohelp
      PGUSER: autohelp
      PGPASSWORD_FILE: /run/secrets/db_password
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    secrets: [db_password]
    volumes: [backups:/backups]
    networks: [private]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      web: {condition: service_healthy}
secrets:
  db_password:
    file: ${DATABASE_PASSWORD_FILE:?Indiquez le fichier privé du mot de passe PostgreSQL}
networks:
  front:
  private: {internal: true}
volumes:
  postgres_data:
  autohelp_instance:
  backups:
  caddy_data:
  caddy_config:
