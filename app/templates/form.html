{% extends 'base.html' %}{% from '_form.html' import fields %}
{% block content %}<div class="form-panel"><p class="eyebrow">MON CARNET</p><h1>{{ title }}</h1>{% if description %}<p class="text-muted">{{ description }}</p>{% endif %}<form method="post" novalidate>{{ fields(form) }}<div class="d-flex gap-3"><button type="submit" class="btn {{ 'btn-danger' if danger else 'btn-primary' }}">{{ 'Supprimer définitivement' if danger else 'Enregistrer' }}</button><a class="btn btn-outline-secondary" href="{{ url_for('vehicles.dashboard') }}">Annuler</a></div></form></div>{% endblock %}
