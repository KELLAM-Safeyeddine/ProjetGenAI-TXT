# Réseau de test isolé ; aucune base ni aucun port de production.
name: autohelp-tests
services:
  db-test:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: autohelp_test
      POSTGRES_USER: auto
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U auto -d autohelp_test]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: autohelp-tests:local
    build:
      context: .
      target: tests
    environment:
      AUTOHELP_TEST_DATABASE_URL: postgresql+psycopg://auto@db-test:5432/autohelp_test
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      SEARCH_API_KEY: ""
      SECRET_DIR: /tmp/autohelp-secrets
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data/manuels:/app/data/manuels:ro
    depends_on:
      db-test:
        condition: service_healthy
    command: [python, -m, pytest, -q, -p, "no:cacheprovider"]
