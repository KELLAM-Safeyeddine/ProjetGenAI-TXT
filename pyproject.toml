[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".work", ".venv", "livraison", "VideoIScreenshots-demo", "app/static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.vercel]
entrypoint = "run:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
