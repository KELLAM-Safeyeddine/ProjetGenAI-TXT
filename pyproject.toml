[project]
name = "autohelp"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
# Vercel privilégie ce manifeste. Garder les versions de requirements.txt ;
# scripts/build_vercel.py vérifie leur concordance avant publication.
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-WTF==1.2.2",
    "Flask-Limiter[redis]==4.1.1",
    "limits==5.8.0",
    "redis==7.4.1",
    "ordered-set==4.1.0",
    "deprecated==3.0.1",
    "wrapt==2.5.2",
    "psycopg[binary]==3.2.12",
    "gunicorn==23.0.0",
    "pytest==9.0.3",
    "pypdf==6.21.4",
    "fonttools==4.67.0",
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "threadpoolctl==3.7.0",
    "narwhals==2.27.1",
    "cloudpickle==3.1.2",
    "alembic==1.20.0",
    "blinker==1.9.0",
    "click==8.5.0",
    "colorama==0.4.6; sys_platform == 'win32'",
    "iniconfig==2.3.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "Mako==1.4.3",
    "MarkupSafe==3.0.4",
    "packaging==26.3",
    "pluggy==1.7.0",
    "Pygments==2.21.0",
    "SQLAlchemy==2.1.5",
    "typing_extensions==4.16.0",
    "tzdata==2026.5",
    "Werkzeug==3.1.9",
    "WTForms==3.2.2",
    "pdfplumber==0.11.10",
    "pdfminer.six==20260107",
    "Pillow==13.0.0",
    "pypdfium2==5.14.0",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "cffi==2.1.1",
    "pycparser==3.12",
]

[tool.uv]
# Application Flask déployée depuis le source, sans installation du dépôt
# comme paquet distribuable (app/, config/ et data/ restent côte à côte).
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".work", ".venv", "livraison", "VideoIScreenshots-demo", "app/static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.vercel]
entrypoint = "run:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
