name: autohelp
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: auto
      POSTGRES_USER: auto
      POSTGRES_PASSWORD_FILE: /run/db-secrets/postgres-password
    entrypoint: ["/bin/sh", "/opt/init-db.sh"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_secrets:/run/db-secrets
      - ./docker/init-db.sh:/opt/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto -d auto"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      FLASK_APP: run:app
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://auto@db:5432/auto}
      DATABASE_PASSWORD_FILE: /run/db-secrets/postgres-password
      SECRET_DIR: /run/app-secrets
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-}
      PORT: ${PORT:-8000}
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    volumes:
      - db_secrets:/run/db-secrets:ro
      - app_secrets:/run/app-secrets
      - ./data/manuels:/app/data/manuels:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  db_secrets:
  app_secrets:
