name: autohelp-livraison
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  web:
    image: autohelp:latest
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_APP: run:app
      APP_ENV: ${APP_ENV:-local}
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_DIR: /app/instance/secrets
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/instance/autohelp.db}
      PORT: ${PORT:-5000}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      PROXY_HOPS: ${PROXY_HOPS:-0}
      DUE_SOON_DAYS: ${DUE_SOON_DAYS:-30}
      DUE_SOON_KM: ${DUE_SOON_KM:-1000}
      DATA_CONTROLLER_NAME: ${DATA_CONTROLLER_NAME:-}
      DATA_CONTROLLER_CONTACT: ${DATA_CONTROLLER_CONTACT:-}
      CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-0}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_CALL_TIMEOUT: ${LLM_CALL_TIMEOUT:-5}
      LLM_TOTAL_TIMEOUT: ${LLM_TOTAL_TIMEOUT:-20}
      LLM_MAX_TURNS: ${LLM_MAX_TURNS:-4}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}
      LLM_CONTEXT_CHARS: ${LLM_CONTEXT_CHARS:-28000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-}
    ports:
      - "127.0.0.1:${PORT:-5000}:${PORT:-5000}"
    volumes:
      - autohelp_data:/app/instance
      - ./data/manuels:/app/data/manuels:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
volumes:
  autohelp_data:
