name: autohelp-livraison
services:
  web:
    image: autohelp:latest
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      FLASK_APP: run:app
      APP_ENV: ${APP_ENV:-local}
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_DIR: /app/instance/secrets
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/instance/autohelp.db}
      PORT: ${PORT:-5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-}
    ports:
      - "127.0.0.1:${PORT:-5000}:${PORT:-5000}"
    volumes:
      - autohelp_data:/app/instance
      - ./data/manuels:/app/data/manuels:ro
    restart: unless-stopped
volumes:
  autohelp_data:
